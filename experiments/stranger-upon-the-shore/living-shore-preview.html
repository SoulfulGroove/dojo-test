<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132522">
<title>Living Shore — Motion Study</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#12221f;color:#f4e9d4;font:15px/1.45 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #aa956b;background:#2a443d;color:#f8ebcd;border-radius:8px;padding:11px 14px}button:focus-visible{outline:3px solid #ffe1a1}button:hover{background:#406154}
main{max-width:1280px;margin:auto;padding:10px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 3px 15px}.head small{font-size:10px;letter-spacing:.18em;color:#dec796}.head h1{font:normal clamp(20px,5vw,34px) Georgia,serif;margin:3px 0}.stage{height:min(72svh,710px);min-height:420px;position:relative;isolation:isolate;overflow:hidden;border:1px solid #b09a78;border-radius:9px;background:#4a6c69 url('assets/shore-scene.webp') center center/cover no-repeat;box-shadow:0 20px 45px #0008}.paint{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}.stage:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(transparent 70%,#101e1f70)}.haze-a{animation:haze 33s ease-in-out infinite alternate}.haze-b{animation:haze 23s ease-in-out -7s infinite alternate-reverse}.water{animation:water 8.5s ease-in-out infinite alternate}.swell{animation:swell 5.4s ease-in-out infinite}.breaker{animation:breaker 4.2s ease-in-out infinite}.bird-a{animation:fly 24s linear -6s infinite}.bird-b{animation:fly2 28s linear -15s infinite}.wings{animation:wing 1.1s ease-in-out infinite}.spray{animation:spray 4.2s ease-in-out infinite}.surge{animation:surge .9s ease-out 1!important}.label{position:absolute;z-index:4;left:14px;top:12px;letter-spacing:.2em;font-size:10px;text-shadow:0 2px 8px #000}.sea-button{position:absolute;z-index:4;left:77%;top:42%;transform:translate(-50%,-50%);border-radius:50%;height:45px;width:45px;padding:0;box-shadow:0 0 0 9px #ffeba72b,0 0 25px #f4d698b5}.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:13px 2px}.foot p{margin:0;max-width:700px;color:#e1d8c5}.foot a{color:#ead19e}.motion-off .paint *{animation:none!important;transition:none!important}.motion-off .bird-a,.motion-off .bird-b,.motion-off .spray{opacity:0!important}
@keyframes haze{from{transform:translate(-35px,4px);opacity:.5}to{transform:translate(58px,-8px);opacity:.95}}@keyframes water{from{transform:translate(-13px,4px);opacity:.3}to{transform:translate(17px,-5px);opacity:.85}}@keyframes swell{0%,100%{transform:translate(-19px,-6px);opacity:.25}53%{transform:translate(16px,11px);opacity:.98}}@keyframes breaker{0%,100%{transform:translate(-15px,-5px);opacity:.2}55%{transform:translate(22px,15px);opacity:.98}}@keyframes fly{0%{transform:translate(-100px,190px);opacity:0}9%,86%{opacity:.52}100%{transform:translate(1660px,132px);opacity:0}}@keyframes fly2{0%{transform:translate(-90px,255px) scale(.67);opacity:0}9%,87%{opacity:.37}100%{transform:translate(1660px,169px) scale(.67);opacity:0}}@keyframes wing{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1.25)}}@keyframes spray{0%,100%{opacity:0;transform:translate(0,5px)}53%{opacity:.85;transform:translate(12px,-9px)}}@keyframes surge{0%{opacity:.2;transform:translate(-12px,-4px)}55%{opacity:1;transform:translate(24px,20px)}100%{opacity:.2;transform:translate(30px,24px)}}
@media(max-width:650px){.stage{min-height:510px;height:70svh}.foot p{flex-basis:100%}}@media(prefers-reduced-motion:reduce){.paint *{animation:none!important}.bird-a,.bird-b,.spray{opacity:0!important}}
</style>
</head>
<body><main><div class="head"><div><small>A STRANGER UPON THE SHORE · MOTION LAB</small><h1>The Living Shore</h1></div><button id="motion" aria-pressed="true">Motion on</button></div>
<div class="stage" id="stage">
<svg class="paint" aria-hidden="true" viewBox="0 0 1536 864" preserveAspectRatio="xMidYMid slice">
<defs><clipPath id="waterClip"><path d="M590 335 Q920 310 1536 344 L1536 864 L680 864 Q720 712 665 615 Q642 513 590 335Z"/></clipPath><radialGradient id="hazeColor"><stop stop-color="#f5e9cd" stop-opacity=".33"/><stop offset="1" stop-color="#d4ddd8" stop-opacity="0"/></radialGradient><linearGradient id="foamColor" x2=".2" y2="1"><stop stop-color="#fff9e7" stop-opacity="0"/><stop offset=".49" stop-color="#fff4e4" stop-opacity=".8"/><stop offset="1" stop-color="#fff9e7" stop-opacity="0"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="8"/></filter></defs>
<g class="haze-a" filter="url(#blur)"><ellipse cx="1010" cy="270" rx="490" ry="110" fill="url(#hazeColor)"/></g>
<g class="haze-b" filter="url(#blur)"><ellipse cx="1210" cy="382" rx="390" ry="50" fill="#ecf0e1" opacity=".18"/></g>
<g clip-path="url(#waterClip)" fill="none" stroke-linecap="round">
<g class="water"><path d="M602 436 Q820 414 1075 436 T1612 425" stroke="#e2eee4" stroke-width="6" opacity=".22"/><path d="M628 487 Q866 459 1145 488 T1640 470" stroke="#f4eddf" stroke-width="8" opacity=".27"/><path d="M660 531 Q874 506 1167 544 T1600 525" stroke="#e4eee1" stroke-width="5" opacity=".23"/></g>
<g class="swell"><path d="M630 618 C840 593 970 644 1144 615 S1473 604 1630 632" stroke="url(#foamColor)" stroke-width="27" filter="url(#blur)"/><path d="M635 619 C848 591 971 645 1148 615 S1473 606 1634 633" stroke="#f8efd9" stroke-width="4" opacity=".46"/></g>
<g class="breaker" id="breaker"><path d="M725 719 C928 692 1031 749 1200 720 S1451 706 1620 739" stroke="url(#foamColor)" stroke-width="32" filter="url(#blur)"/><path d="M732 725 C926 690 1040 754 1206 719 S1460 710 1620 740" stroke="#f7f0dc" stroke-width="5" opacity=".62"/></g>
</g>
<g class="bird-a" fill="none" stroke="#233732" stroke-width="3" stroke-linecap="round"><path class="wings" d="M-24 0 Q-11 -13 0 -1 Q11 -13 24 0"/></g><g class="bird-b" fill="none" stroke="#293d35" stroke-width="2.5" stroke-linecap="round"><path class="wings" d="M-17 0 Q-8 -10 0 -1 Q8 -10 17 0"/></g><g class="spray" fill="#f9efdf"><circle cx="1046" cy="697" r="3"/><circle cx="1062" cy="693" r="2"/><circle cx="1319" cy="720" r="2.5"/></g>
</svg><span class="label">CHAPTER I · THE UNFAMILIAR SHORE</span><button class="sea-button" id="inspect" aria-label="Inspect the surf">＋</button>
</div><div class="foot"><p>A test of independently moving, painted-style water ribbons, coastal haze, birds and sea spray over the existing still image. Tap the glowing point for a stronger wave. <span id="reaction"></span></p><div><a href="./">Return to playable prologue</a></div></div>
</main><script>
(()=>{const stage=document.getElementById('stage'),button=document.getElementById('motion'),breaker=document.getElementById('breaker'),reaction=document.getElementById('reaction');let moving=true;button.addEventListener('click',()=>{moving=!moving;stage.classList.toggle('motion-off',!moving);button.setAttribute('aria-pressed',String(moving));button.textContent=moving?'Motion on':'Motion off'});document.getElementById('inspect').addEventListener('click',()=>{reaction.textContent='The next wave breaks against the shore.';if(!moving||matchMedia('(prefers-reduced-motion: reduce)').matches)return;breaker.classList.remove('surge');void breaker.getBoundingClientRect().width;breaker.classList.add('surge')})})();
</script></body></html>
