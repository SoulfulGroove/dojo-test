<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Offer Dojo v0.3 HUD Lab</title><style>:root{--bg:#09100c;--panel:#111914;--ink:#eee8da;--muted:#8f9a92;--gold:#c8a45f;--gold2:#ecd39c;--line:#2e3b33;--green:#67876c;--red:#8f5148}*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;background:radial-gradient(circle at top,#1d2c23,#09100c 48%);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:10px 8px 26px}.hud{position:sticky;top:0;z-index:10;background:rgba(9,16,12,.96);backdrop-filter:blur(10px);padding:7px 4px 9px;border-bottom:1px solid #243029}.hudtop{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:end}.brand{font-family:Georgia,serif;font-size:1.15rem;font-weight:800}.metric{text-align:right}.metric b{display:block;font-size:.82rem;font-variant-numeric:tabular-nums}.metric small{display:block;color:var(--muted);font-size:.52rem;letter-spacing:.08em;text-transform:uppercase}.barrow{display:flex;align-items:center;gap:8px;margin-top:7px}.bar{height:10px;flex:1;border-radius:999px;background:#202b24;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#806d45,var(--gold2));transition:.2s}.count{font-size:.7rem;color:var(--gold2);font-weight:850;min-width:38px;text-align:right}.styles,.skills{display:flex;gap:6px;overflow:auto;scrollbar-width:none;padding:8px 0 0}.styles::-webkit-scrollbar,.skills::-webkit-scrollbar{display:none}.pill,.skill{flex:0 0 auto;border:1px solid var(--line);background:#0f1612;color:#aab2ab;border-radius:999px;min-height:38px;padding:8px 12px;font-size:.68rem;font-weight:850}.skill{border-radius:11px;min-width:105px;text-align:left}.skill small{display:block;color:#6e7971;font-size:.55rem;margin-top:2px}.pill.active,.skill.active{border-color:var(--gold);background:#292218;color:#f2dfb7}.arena{margin-top:8px;border:1px solid var(--line);background:linear-gradient(#141d18,#0e1511);border-radius:18px;overflow:hidden}.rephead{padding:12px 13px 0;display:flex;justify-content:space-between;gap:10px}.rephead h2{font:800 1.05rem Georgia,serif;margin:0}.rephead p{margin:3px 0 0;color:var(--muted);font-size:.66rem}.reptime{color:var(--gold2);font-size:.73rem;font-weight:900}.stimulus{min-height:235px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}.label{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#77827a;font-weight:900}.big{font:400 clamp(3.8rem,19vw,7rem)/.95 Georgia,serif;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:500px}.card{background:#0a110d;border:1px solid #2a352f;border-radius:12px;padding:11px 6px}.card b{display:block;font-size:1.05rem}.card small{color:#748078;font-size:.56rem;text-transform:uppercase;letter-spacing:.07em}.deck{border-top:1px solid #222e27;padding:10px 11px 12px;background:#0c130f}.display{display:flex;gap:7px;align-items:center;justify-content:center;min-height:52px}.slot{flex:1;min-height:52px;border:1px solid #594b31;border-radius:12px;background:#080d0a;color:var(--ink);font-size:1.35rem;font-weight:900;display:flex;align-items:center;justify-content:center}.slot.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,164,95,.11)}.dash{font-weight:900;color:var(--muted)}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.key{min-height:52px;border:1px solid #354139;border-radius:12px;background:#151d18;color:var(--ink);font-size:1.15rem;font-weight:850}.key.alt{color:var(--gold2);font-size:.85rem}.key.go{background:#2c2519;border-color:#705e3a}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{min-height:64px;border-radius:13px;background:#111914;color:var(--ink);font-weight:950;border:1px solid #39463e}.choice.strike{border-color:#56715b}.choice.pass{border-color:#724b46}.feedback{min-height:42px;margin-top:8px;padding:8px 10px;border:1px solid #26322b;border-radius:10px;color:#aab3ac;font-size:.68rem;line-height:1.35}.feedback.good{border-color:#4f6955;color:#c7d9c9}.feedback.bad{border-color:#704943;color:#dfbbb4}.next{display:none;width:100%;min-height:50px;margin-top:7px;border-radius:11px;border:1px solid var(--gold);background:#302719;color:#f2dfb7;font-weight:950}.next.show{display:block}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:9px}.tiny{flex:1;min-height:40px;border:1px solid #334038;border-radius:10px;background:#0d1410;color:#aeb6af;font-size:.65rem;font-weight:800}.hidden{display:none!important}@media(max-width:420px){.hudtop{grid-template-columns:1fr repeat(3,auto);gap:7px}.brand{font-size:1rem}.metric b{font-size:.74rem}.stimulus{min-height:210px}.cards{gap:5px}.card{padding:9px 4px}.card b{font-size:.93rem}.key{min-height:50px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}</style></head><body><main class="app" id="app"><header class="hud"><div class="hudtop"><div class="brand">Offer Dojo · HUD Lab</div><div class="metric"><b id="avg">—</b><small>avg</small></div><div class="metric"><b id="acc">—</b><small>accuracy</small></div><div class="metric"><b id="streak">0</b><small>streak</small></div></div><div class="barrow"><div class="bar"><i id="bar"></i></div><div class="count" id="count">0/20</div></div><div class="styles"><button class="pill active" data-style="accuracy">Accuracy</button><button class="pill" data-style="fluency">Fluency</button><button class="pill" data-style="speed">Speed</button></div><nav class="skills"><button class="skill active" data-mode="approx">Approximate<small>decimal → whole</small></button><button class="skill" data-mode="band">Build Band<small>×2 · ×3</small></button><button class="skill" data-mode="bandkata">Band Kata<small>payout → band</small></button><button class="skill" data-mode="time">Total Time<small>miles ×2 + shown</small></button><button class="skill" data-mode="compare">Compare<small>time vs band</small></button><button class="skill" data-mode="kata">Full Kata<small>Strike / Pass</small></button></nav></header><section class="arena"><div class="rephead"><div><h2 id="title">Whole-number approximation</h2><p id="sub">Use any convenient, decision-safe whole number.</p></div><div class="reptime" id="timer">0.0s</div></div><div class="stimulus" id="stimulus"></div><div class="deck"><div id="numeric"><div class="display" id="display"></div><div class="keypad" id="keypad"><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key alt" data-key="back">⌫</button><button class="key" data-key="0">0</button><button class="key go" data-key="go">LOCK</button></div></div><div class="choices hidden" id="choices"><button class="choice strike" data-choice="strike">STRIKE</button><button class="choice pass" data-choice="pass">PASS</button></div><div class="feedback" id="feedback">Fixed HUD experiment: the page should not move while you enter numbers.</div><button class="next" id="next">NEXT REP</button></div></section><div class="footer"><button class="tiny" id="newset">New 20-rep set</button><button class="tiny" id="reset">Reset stats</button></div></main><script>(()=>{const root=document.getElementById('app'),$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],STORE='offerDojoV03';const info={approx:['Whole-number approximation','Use any convenient, decision-safe whole number.'],band:['Acceptable-band determination','Whole payout → ×2 and ×3 boundaries.'],bandkata:['Band Kata','Approximate the displayed payout, then build the band.'],time:['Total-time estimation','Approximate mileage, ×2, then add shown time.'],compare:['Band comparison','Decide whether total time remains inside the band.'],kata:['Offer Qualification Kata','Run the full chain and make the final decision.']};let S={mode:'approx',style:'accuracy',cur:null,a:'',b:'',slot:0,set:0,size:20,start:0,tick:null,locked:false,stats:{reps:0,correct:0,ms:0,streak:0}};try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){S.stats=x.stats||S.stats;S.set=x.set||0}}catch(e){}const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,money=()=>+(ri(600,5500)/100).toFixed(2),sec=m=>(m/1000).toFixed(1)+'s';function save(){try{localStorage.setItem(STORE,JSON.stringify({stats:S.stats,set:S.set}))}catch(e){}}function hud(){const s=S.stats;$('#avg').textContent=s.reps?sec(s.ms/s.reps):'—';$('#acc').textContent=s.reps?Math.round(s.correct/s.reps*100)+'%':'—';$('#streak').textContent=s.streak;$('#count').textContent=S.set+'/'+S.size;$('#bar').style.width=Math.min(100,S.set/S.size*100)+'%'}function clock(){clearInterval(S.tick);S.start=performance.now();$('#timer').textContent='0.0s';S.tick=setInterval(()=>$('#timer').textContent=sec(performance.now()-S.start),100)}function stop(){clearInterval(S.tick);return performance.now()-S.start}function build(){if(S.mode==='approx')return{t:'approx',pay:money()};if(S.mode==='band'){let n=ri(6,55);return{t:'band',n,lo:n*2,hi:n*3}}if(S.mode==='bandkata'){let pay=money(),n=Math.round(pay);return{t:'bandkata',pay,n,lo:n*2,hi:n*3}}if(S.mode==='time'){let shown=ri(12,72),miles=+(ri(10,300)/10).toFixed(1),m=Math.round(miles);return{t:'time',shown,miles,m,total:shown+m*2}}if(S.mode==='compare'){let n=ri(7,55),lo=n*2,hi=n*3,total=Math.random()<.5?ri(Math.max(5,lo-18),hi):hi+ri(4,26);return{t:'compare',lo,hi,total,q:total<=hi}}for(let i=0;i<200;i++){let pay=money(),shown=ri(12,75),miles=+(ri(5,300)/10).toFixed(1),gap=pay*3-(shown+miles*2);if(Math.abs(gap)>=7)return{t:'kata',pay,shown,miles,q:gap>=0}}}function draw(){const c=S.cur,p=$('#stimulus');if(c.t==='approx'||c.t==='bandkata')p.innerHTML='<div><div class="label">Displayed payout</div><div class="big">$'+c.pay.toFixed(2)+'</div></div>';else if(c.t==='band')p.innerHTML='<div><div class="label">Whole-dollar payout</div><div class="big">'+c.n+'</div></div>';else if(c.t==='time')p.innerHTML='<div class="cards"><div class="card"><b>'+c.shown+' min</b><small>shown</small></div><div class="card"><b>'+c.miles+' mi</b><small>mileage</small></div><div class="card"><b>×2</b><small>reposition</small></div></div>';else if(c.t==='compare')p.innerHTML='<div class="cards"><div class="card"><b>'+c.lo+'–'+c.hi+'</b><small>band</small></div><div class="card"><b>'+c.total+' min</b><small>total</small></div><div class="card"><b>'+c.hi+'</b><small>floor edge</small></div></div>';else p.innerHTML='<div class="cards"><div class="card"><b>$'+c.pay.toFixed(2)+'</b><small>payout</small></div><div class="card"><b>'+c.shown+' min</b><small>shown</small></div><div class="card"><b>'+c.miles+' mi</b><small>mileage</small></div></div>';renderDisplay()}function renderDisplay(){const dual=S.mode==='band'||S.mode==='bandkata';$('#display').innerHTML=dual?'<div class="slot '+(S.slot===0?'active':'')+'">'+(S.a||'LOW')+'</div><span class="dash">—</span><div class="slot '+(S.slot===1?'active':'')+'">'+(S.b||'HIGH')+'</div>':'<div class="slot active">'+(S.a||'ANSWER')+'</div>'}function prep(){S.cur=build();S.a='';S.b='';S.slot=0;S.locked=false;$('#feedback').className='feedback';$('#feedback').textContent=S.style==='accuracy'?'Accuracy: take a clean rep.':S.style==='fluency'?'Fluency: keep the rhythm smooth.':'Speed: answer quickly without giving away accuracy.';$('#next').classList.remove('show');const choice=S.mode==='compare'||S.mode==='kata';$('#numeric').classList.toggle('hidden',choice);$('#choices').classList.toggle('hidden',!choice);draw();clock()}function key(k){if(S.locked)return;if(k==='back'){if(S.slot===0)S.a=S.a.slice(0,-1);else S.b=S.b.slice(0,-1);renderDisplay();return}if(k==='go'){check();return}if(S.slot===0)S.a=(S.a+k).slice(0,3);else S.b=(S.b+k).slice(0,3);if((S.mode==='band'||S.mode==='bandkata')&&S.slot===0&&S.a.length>=2)S.slot=1;renderDisplay()}function done(ok,ms,msg){S.locked=true;let s=S.stats;s.reps++;s.ms+=ms;s.streak=ok?s.streak+1:0;if(ok)s.correct++;S.set=Math.min(S.size,S.set+1);save();hud();let f=$('#feedback');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'<strong>Clean rep.</strong> ':'<strong>Miss.</strong> ')+msg+' · '+sec(ms)+(S.set>=S.size?'<br><strong>Kihon bar complete.</strong>':'');if(ok&&(S.style==='fluency'||S.style==='speed'))setTimeout(prep,S.style==='speed'?250:550);else $('#next').classList.add('show')}function check(){if(S.locked)return;let c=S.cur,ms=stop(),a=Number(S.a),b=Number(S.b);if(!Number.isFinite(a))return;if(c.t==='approx'){let d=Math.abs(a-c.pay);done(Number.isInteger(a)&&d<=2.01,ms,a+' is '+(d<=2.01?'usable.':'too far from the payout.'))}else if(c.t==='band'||c.t==='bandkata'){if(!Number.isFinite(b))return;done(a===c.lo&&b===c.hi,ms,'Correct band: '+c.lo+'–'+c.hi+'.')}else if(c.t==='time')done(Math.abs(a-c.total)<=4,ms,'Using '+c.m+' mi gives about '+c.total+' min.')}function choose(v){if(S.locked)return;let c=S.cur,ms=stop(),q=v==='strike';if(c.t==='compare')done(q===c.q,ms,c.total+' vs '+c.lo+'–'+c.hi+' → '+(c.q?'STRIKE':'PASS')+'.');else{let n=Math.round(c.pay),lo=n*2,hi=n*3,m=Math.round(c.miles),tot=c.shown+m*2;done(q===c.q,ms,n+' → '+lo+'–'+hi+'; total ≈ '+tot+' → '+(c.q?'STRIKE':'PASS')+'.')}}$$('.key').forEach(b=>b.addEventListener('click',()=>key(b.dataset.key)));$$('.choice').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.choice)));$$('.skill').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;$$('.skill').forEach(x=>x.classList.toggle('active',x===b));$('#title').textContent=info[S.mode][0];$('#sub').textContent=info[S.mode][1];S.set=0;hud();prep()}));$$('.pill').forEach(b=>b.addEventListener('click',()=>{S.style=b.dataset.style;$$('.pill').forEach(x=>x.classList.toggle('active',x===b));prep()}));$('#next').addEventListener('click',prep);$('#newset').addEventListener('click',()=>{S.set=0;save();hud();prep()});$('#reset').addEventListener('click',()=>{S.stats={reps:0,correct:0,ms:0,streak:0};S.set=0;save();hud();prep()});hud();prep()})();</script></body></html>
