<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Offer Qualification Dojo v0.2</title>
<style>
:root{--bg:#0a0f0c;--panel:#121916;--ink:#eee7d9;--muted:#929d95;--gold:#c8a45f;--gold2:#ecd29a;--green:#6f8f72;--red:#a75b50;--line:#303c35;--soft:#0e1511}*{box-sizing:border-box}html{background:var(--bg);-webkit-text-size-adjust:100%}body{margin:0;background:radial-gradient(circle at 50% -8%,#1e2d25 0,#0a0f0c 50%);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.app{max-width:780px;margin:auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{color:var(--gold);font-weight:900;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}.title{margin:3px 0 0;font-family:ui-serif,Georgia,serif;font-size:clamp(1.55rem,7vw,2.7rem);line-height:1}.statsline{font-size:.7rem;color:var(--muted);white-space:nowrap;padding-top:3px}.statsline b{color:var(--ink)}.session{margin:12px 0 10px}.session-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.session-head span{font-size:.68rem;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.session-head b{font-size:.76rem;color:var(--gold2);font-variant-numeric:tabular-nums}.bar{height:13px;border-radius:999px;background:#202a24;overflow:hidden;border:1px solid #29342e}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#806d45,var(--gold2));transition:width .2s ease}.mode-strip,.skill-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.mode-strip::-webkit-scrollbar,.skill-strip::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;min-height:42px;border:1px solid var(--line);background:#101713;color:#a9b1aa;border-radius:999px;padding:9px 13px;font-size:.72rem;font-weight:850}.pill.active{border-color:var(--gold);background:#292319;color:#f1dfb8}.skill{flex:0 0 auto;min-width:120px;border:1px solid var(--line);background:#101713;color:#a9b1aa;border-radius:12px;padding:10px 11px;text-align:left;font-weight:850;font-size:.72rem}.skill small{display:block;color:#6f7a72;font-weight:700;font-size:.61rem;margin-top:3px}.skill.active{border-color:var(--gold);background:#282218;color:#f1dfb8}.arena{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#151e19,#0f1512);min-height:520px;padding:16px;display:flex;flex-direction:column}.arena-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.arena-title{font-family:ui-serif,Georgia,serif;font-size:1.12rem;font-weight:800}.arena-sub{font-size:.7rem;color:var(--muted);line-height:1.35;margin-top:3px}.timer{font-size:.78rem;color:var(--gold2);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}.prompt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 0}.label{font-size:.66rem;color:#78837c;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.big{font-family:ui-serif,Georgia,serif;font-size:clamp(4rem,20vw,7.5rem);line-height:.96;margin:12px 0 6px;font-variant-numeric:tabular-nums}.offer-grid{width:100%;max-width:540px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.offer-box{border:1px solid #2e3933;background:#0c120f;border-radius:13px;padding:12px 8px}.offer-box b{display:block;font-size:1.12rem;font-variant-numeric:tabular-nums}.offer-box small{display:block;color:#748078;font-size:.61rem;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}.response{margin-top:auto}.single-input,.band-input{width:100%;min-height:58px;border:1px solid #3b473f;background:#090f0c;color:var(--ink);border-radius:14px;padding:10px 14px;text-align:center;font-size:1.35rem;font-weight:850;outline:none;-webkit-appearance:none}.single-input:focus,.band-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,95,.12)}.band-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.band-dash{font-size:1.35rem;color:var(--muted);font-weight:900}.action{width:100%;min-height:56px;border-radius:14px;border:1px solid #6c5a38;background:#292319;color:#f2dfb4;font-weight:900;margin-top:9px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{min-height:64px;border-radius:14px;background:#101713;color:var(--ink);font-weight:950;letter-spacing:.04em;border:1px solid #3a463f}.choice.strike{border-color:#57705b}.choice.pass{border-color:#6a4945}.feedback{margin-top:9px;min-height:48px;border-radius:12px;background:#0c120f;border:1px solid #26302a;padding:9px 11px;color:#aab2ab;font-size:.72rem;line-height:1.38}.feedback.good{border-color:#506856;color:#c7d8c9}.feedback.bad{border-color:#744b46;color:#dfbbb5}.feedback strong{color:var(--ink)}.next{display:none;width:100%;min-height:58px;margin-top:9px;border-radius:14px;border:1px solid var(--gold);background:#332a1b;color:#f3dfb4;font-weight:950;font-size:1rem}.next.show{display:block}.mini-forge{margin-top:10px;border:1px solid var(--line);border-radius:15px;background:#101713;padding:10px 11px}.forge-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center}.forge-row b{display:block;font-size:.9rem;font-variant-numeric:tabular-nums}.forge-row span{display:block;color:#748078;font-size:.56rem;text-transform:uppercase;letter-spacing:.07em;margin-top:2px}.forge-actions{display:flex;gap:8px;margin-top:8px}.tiny{flex:1;min-height:40px;border-radius:11px;border:1px solid #354139;background:#0d1410;color:#aeb6af;font-weight:800;font-size:.68rem}.hidden{display:none!important}@media(max-width:560px){.app{padding:10px 8px calc(22px + env(safe-area-inset-bottom))}.top{padding:2px 4px}.statsline{display:none}.arena{min-height:500px;border-radius:17px;padding:13px}.offer-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.offer-box{padding:10px 5px}.offer-box b{font-size:1rem}.forge-row{grid-template-columns:repeat(4,1fr)}.mode-strip,.skill-strip{margin-left:-2px;margin-right:-2px}}@media(max-width:360px){.offer-grid{grid-template-columns:1fr 1fr}.offer-box:last-child{grid-column:1/-1}.big{font-size:3.8rem}.arena{min-height:490px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app" id="app">
<header class="top"><div><div class="eyebrow">Road Warrior · Dojo v0.2</div><h1 class="title">Offer Qualification</h1></div><div class="statsline"><b id="topAcc">—</b> accuracy · <b id="topAvg">—</b> avg</div></header>
<section class="session"><div class="session-head"><span>Kihon Bar · current set</span><b id="setCount">0 / 20</b></div><div class="bar"><i id="setBar"></i></div></section>
<div class="mode-strip" aria-label="Training style"><button class="pill active" data-style="accuracy">Accuracy</button><button class="pill" data-style="fluency">Fluency</button><button class="pill" data-style="speed">Speed</button></div>
<nav class="skill-strip" aria-label="Drill skill"><button class="skill active" data-mode="approx">Approximate<small>decimal → whole</small></button><button class="skill" data-mode="band">Build Band<small>×2 · ×3</small></button><button class="skill" data-mode="time">Total Time<small>miles ×2 + shown</small></button><button class="skill" data-mode="compare">Compare<small>time vs band</small></button><button class="skill" data-mode="kata">Full Kata<small>Strike / Pass</small></button></nav>
<section class="arena">
<div class="arena-head"><div><div class="arena-title" id="arenaTitle">Whole-number approximation</div><div class="arena-sub" id="arenaSub">Produce a usable whole-dollar mental representation.</div></div><div class="timer" id="timer">0.0s</div></div>
<div class="prompt" id="prompt"></div>
<div class="response">
<form id="singleForm"><input class="single-input" id="singleInput" type="number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Answer" aria-label="Answer"><button class="action" type="submit">LOCK REP</button></form>
<form id="bandForm" class="hidden"><div class="band-row"><input class="band-input" id="lowerInput" type="number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="LOW" aria-label="Lower band"><span class="band-dash">—</span><input class="band-input" id="upperInput" type="number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="HIGH" aria-label="Upper band"></div><button class="action" type="submit">LOCK BAND</button></form>
<div class="choices hidden" id="choices"><button class="choice strike" type="button" data-choice="strike">STRIKE</button><button class="choice pass" type="button" data-choice="pass">PASS</button></div>
<div class="feedback" id="feedback" aria-live="polite">Accuracy mode: take the time you need. One clean rep at a time.</div><button class="next" id="nextRep" type="button">NEXT REP</button>
</div>
</section>
<section class="mini-forge"><div class="forge-row"><div><b id="reps">0</b><span>total reps</span></div><div><b id="accuracy">—</b><span>accuracy</span></div><div><b id="avgTime">—</b><span>avg time</span></div><div><b id="streak">0</b><span>streak</span></div></div><div class="forge-actions"><button class="tiny" id="newSet" type="button">New 20-rep set</button><button class="tiny" id="resetAll" type="button">Reset stats</button></div></section>
</main>
<script>
(()=>{const root=document.getElementById('app'),$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],STORE='offerDojoV02';const info={approx:['Whole-number approximation','Produce a usable whole-dollar mental representation.'],band:['Acceptable-band determination','Multiply the payout by 2 and 3. Enter each boundary separately.'],time:['Total-time estimation','Approximate mileage, ×2 for reposition time, then add shown time.'],compare:['Band comparison','Decide whether total estimated time remains at or below the ×3 edge.'],kata:['Offer Qualification Kata','Run the complete chain mentally and make the final decision.']};let state={mode:'approx',style:'accuracy',current:null,started:0,timer:null,setReps:0,setSize:20,locked:false,stats:{reps:0,correct:0,totalMs:0,streak:0}};try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s&&s.stats)state.stats=s.stats;if(s&&Number.isFinite(s.setReps))state.setReps=s.setReps}catch(e){}const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,money=()=>+(ri(600,5500)/100).toFixed(2),secs=ms=>(ms/1000).toFixed(1)+'s';function save(){try{localStorage.setItem(STORE,JSON.stringify({stats:state.stats,setReps:state.setReps}))}catch(e){}}function updateHUD(){const s=state.stats,acc=s.reps?Math.round(s.correct/s.reps*100)+'%':'—',avg=s.reps?secs(s.totalMs/s.reps):'—';$('#reps').textContent=s.reps;$('#accuracy').textContent=acc;$('#avgTime').textContent=avg;$('#streak').textContent=s.streak;$('#topAcc').textContent=acc;$('#topAvg').textContent=avg;$('#setCount').textContent=state.setReps+' / '+state.setSize;$('#setBar').style.width=Math.min(100,state.setReps/state.setSize*100)+'%'}function startClock(){clearInterval(state.timer);state.started=performance.now();$('#timer').textContent='0.0s';state.timer=setInterval(()=>$('#timer').textContent=secs(performance.now()-state.started),100)}function stopClock(){clearInterval(state.timer);state.timer=null;return performance.now()-state.started}function build(){if(state.mode==='approx')return{type:'approx',pay:money()};if(state.mode==='band'){const n=ri(6,55);return{type:'band',n,lo:n*2,hi:n*3}}if(state.mode==='time'){const shown=ri(12,72),miles=+(ri(10,300)/10).toFixed(1),rounded=Math.round(miles);return{type:'time',shown,miles,rounded,total:shown+rounded*2}}if(state.mode==='compare'){const n=ri(7,55),lo=n*2,hi=n*3,total=Math.random()<.5?ri(Math.max(5,lo-18),hi):hi+ri(4,26);return{type:'compare',lo,hi,total,qualifies:total<=hi}}for(let i=0;i<200;i++){const pay=money(),shown=ri(12,75),miles=+(ri(5,300)/10).toFixed(1),gap=pay*3-(shown+miles*2);if(Math.abs(gap)>=7)return{type:'kata',pay,shown,miles,qualifies:gap>=0}}return{type:'kata',pay:30.1,shown:38,miles:8.2,qualifies:true}}function prompt(){const c=state.current,p=$('#prompt');if(c.type==='approx')p.innerHTML='<div class="label">Displayed payout</div><div class="big">$'+c.pay.toFixed(2)+'</div>';else if(c.type==='band')p.innerHTML='<div class="label">Whole-dollar payout</div><div class="big">'+c.n+'</div>';else if(c.type==='time')p.innerHTML='<div class="label">Estimate total offer time</div><div class="offer-grid"><div class="offer-box"><b>'+c.shown+' min</b><small>shown</small></div><div class="offer-box"><b>'+c.miles+' mi</b><small>mileage</small></div><div class="offer-box"><b>×2</b><small>reposition</small></div></div>';else if(c.type==='compare')p.innerHTML='<div class="label">Does it qualify?</div><div class="offer-grid"><div class="offer-box"><b>'+c.lo+'–'+c.hi+'</b><small>band</small></div><div class="offer-box"><b>'+c.total+' min</b><small>total</small></div><div class="offer-box"><b>'+c.hi+'</b><small>floor edge</small></div></div>';else p.innerHTML='<div class="label">Live offer</div><div class="offer-grid"><div class="offer-box"><b>$'+c.pay.toFixed(2)+'</b><small>payout</small></div><div class="offer-box"><b>'+c.shown+' min</b><small>shown</small></div><div class="offer-box"><b>'+c.miles+' mi</b><small>mileage</small></div></div>'}function prep(){state.current=build();state.locked=false;$('#feedback').className='feedback';$('#feedback').textContent=state.style==='accuracy'?'Accuracy mode: take the time you need. One clean rep at a time.':state.style==='fluency'?'Fluency mode: keep a smooth rhythm. Correct reps advance automatically.':'Speed mode: respond quickly without sacrificing correctness.';$('#nextRep').classList.remove('show');$('#singleForm').classList.toggle('hidden',state.mode==='band'||state.mode==='compare'||state.mode==='kata');$('#bandForm').classList.toggle('hidden',state.mode!=='band');$('#choices').classList.toggle('hidden',state.mode!=='compare'&&state.mode!=='kata');$('#singleInput').value='';$('#lowerInput').value='';$('#upperInput').value='';prompt();startClock();if(state.mode==='approx'||state.mode==='time')setTimeout(()=>$('#singleInput').focus({preventScroll:true}),50);else if(state.mode==='band')setTimeout(()=>$('#lowerInput').focus({preventScroll:true}),50)}function result(ok,ms,msg){if(state.locked)return;state.locked=true;const s=state.stats;s.reps++;s.totalMs+=ms;s.streak=ok?s.streak+1:0;if(ok)s.correct++;state.setReps=Math.min(state.setSize,state.setReps+1);save();updateHUD();const f=$('#feedback');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'<strong>Clean rep.</strong> ':'<strong>Miss.</strong> ')+msg+' · '+secs(ms);if(state.setReps>=state.setSize)f.innerHTML+='<br><strong>Kihon bar complete.</strong>';if(ok&&(state.style==='fluency'||state.style==='speed'))setTimeout(prep,state.style==='speed'?320:650);else $('#nextRep').classList.add('show')}function checkSingle(){if(state.locked)return;const v=Number($('#singleInput').value);if(!Number.isFinite(v)){return}const c=state.current,ms=stopClock();if(c.type==='approx'){const a=Math.round(v),diff=Math.abs(a-c.pay),ok=Number.isInteger(v)&&diff<=2.01;result(ok,ms,ok?a+' is a usable whole-number approximation.':'Keep it whole and reasonably close; '+Math.floor(c.pay)+' or '+Math.round(c.pay)+' are natural choices.')}else{const diff=Math.abs(v-c.total);result(diff<=4,ms,'Using '+c.rounded+' mi gives about '+c.total+' minutes.')}}function checkBand(){if(state.locked)return;const lo=Number($('#lowerInput').value),hi=Number($('#upperInput').value);if(!Number.isFinite(lo)||!Number.isFinite(hi))return;const c=state.current,ms=stopClock();result(lo===c.lo&&hi===c.hi,ms,'Correct band: '+c.lo+'–'+c.hi+' minutes.')}function choose(v){if(state.locked)return;const c=state.current,ms=stopClock(),said=v==='strike',ok=said===c.qualifies;if(c.type==='compare')result(ok,ms,'Total '+c.total+' vs '+c.lo+'–'+c.hi+' → '+(c.qualifies?'STRIKE':'PASS')+'.');else{const p=Math.round(c.pay),lo=p*2,hi=p*3,m=Math.round(c.miles),tot=c.shown+m*2;result(ok,ms,'One clean path: '+p+' → '+lo+'–'+hi+'; '+c.miles+'≈'+m+' mi → '+tot+' total → '+(c.qualifies?'STRIKE':'PASS')+'.')}}function setMode(m){state.mode=m;$$('.skill').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('#arenaTitle').textContent=info[m][0];$('#arenaSub').textContent=info[m][1];state.setReps=0;save();updateHUD();prep()}function setStyle(s){state.style=s;$$('.pill').forEach(b=>b.classList.toggle('active',b.dataset.style===s));prep()}$$('.skill').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$$('.pill').forEach(b=>b.addEventListener('click',()=>setStyle(b.dataset.style)));$('#singleForm').addEventListener('submit',e=>{e.preventDefault();checkSingle()});$('#bandForm').addEventListener('submit',e=>{e.preventDefault();checkBand()});$$('.choice').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.choice)));$('#nextRep').addEventListener('click',prep);$('#newSet').addEventListener('click',()=>{state.setReps=0;save();updateHUD();prep()});$('#resetAll').addEventListener('click',()=>{state.stats={reps:0,correct:0,totalMs:0,streak:0};state.setReps=0;save();updateHUD();prep()});updateHUD();prep()})();
</script>
</body>
</html>
