name: Import Harvard historical Japan provinces
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-japan-kuni-geojson.yml"
      - "experiments/japan-province-explorer/data/import-harvard-provinces.py"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shapefile/GIS dependencies
        run: python -m pip install --quiet requests geopandas pyogrio shapely pyproj
      - name: Fetch and convert Harvard historical kuni geometry
        run: python experiments/japan-province-explorer/data/import-harvard-provinces.py
      - name: Commit generated web GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/japan-province-explorer/data/harvard-kuni.geojson experiments/japan-province-explorer/data/harvard-kuni-metadata.json
          if git diff --staged --quiet; then echo "No changes to historical provinces"; else git commit -m "Import Harvard GIS province boundaries for map explorer"; git push; fi
